name: Security audit

# Daily, so new advisories show up between PRs (merge.yml's cargo-deny only
# runs on pull requests). Same tool and deny.toml as the PR check.
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
