[workspace]
members = ["nodejs"]

[package]
authors = ["MaidSafe Developers <dev@maidsafe.net>"]
categories = ["cryptography", "filesystem"]
description = "Self-encrypting, content-addressed storage - convergent encryption that splits data into obfuscated chunks. The peer-reviewed core of Autonomi."
documentation = "https://docs.rs/self_encryption"
edition = "2018"
homepage = "https://autonomi.com"
keywords = ["encryption", "convergent", "storage", "autonomi", "deduplication"]
license = "MIT OR Apache-2.0"
name = "self_encryption"
readme = "README.md"
repository = "https://github.com/WithAutonomi/self_encryption"
version = "0.36.2"

[features]
default = []
python = [
    "dep:pyo3",
    "serde_json"
]

[dependencies]
blake3 = "1"
bincode = "~1.3.3"
chacha20poly1305 = "0.10"
hex = "~0.4.3"
rand = "~0.8.5"
rand_chacha = "~0.3.1"
rayon = "1.5.1"
thiserror = "1.0"
tempfile = "3.6.0"
xor_name = "5.0.0"
pyo3 = { version = "0.24.2", optional = true, features = ["extension-module"] }
serde_json = { version = "1.0", optional = true }

[dependencies.brotli]
version = "~3.3.0"
default-features = false
features = ["std"]

[dependencies.bytes]
version = "1.1.0"
features = ["serde"]

[dependencies.serde]
version = "1.0.136"
features = ["derive"]

[dependencies.tokio]
version = "1.34.0"
features = ["rt"]

[dev-dependencies]
criterion = "0.5.1"
docopt = "~0.9.0"
clap = { version = "4.4", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies.tokio]
version = "1.34.0"
features = ["rt-multi-thread", "macros"]

[[example]]
bench = false
name = "basic_encryptor"

[[bench]]
name = "lib"
harness = false

[lib]
name = "self_encryption"
crate-type = ["cdylib", "rlib"]
